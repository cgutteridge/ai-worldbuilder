# Shared OSM schema for the standard cell-extract presets.
# GDAL OSM driver: https://gdal.org/en/stable/drivers/vector/osm.html
# No [general] section, for compatibility with GDAL versions before 3.10.
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=pedestrian,highway=platform,public_transport=platform

[points]
osm_id=yes
attributes=name,barrier,highway,amenity,natural,entrance,traffic_sign,information,man_made,shop
other_tags=yes

[lines]
osm_id=yes
attributes=name,highway,waterway,barrier,man_made,railway,natural
other_tags=yes

[multipolygons]
osm_id=yes
attributes=name,type,building,landuse,natural,leisure,highway,amenity,barrier,waterway,railway,shop
other_tags=yes

[multilinestrings]
osm_id=yes
attributes=name,type,waterway,railway
other_tags=yes

[other_relations]
osm_id=yes
attributes=name,type
other_tags=yes
